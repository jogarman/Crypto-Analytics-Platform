[tool.poetry]
name = "crypto-analytics"
version = "0.1.0"
description = "Iteration 1 backend scaffold for the crypto analytics platform."
authors = ["jgarcia <you@example.com>"]
packages = [{ include = "crypto_analytics" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
pydantic = "^2.6"
httpx = "^0.27"
python-dotenv = "^1.0"
motor = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.21"
mypy = "^1.10"
ruff = "^0.1"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

